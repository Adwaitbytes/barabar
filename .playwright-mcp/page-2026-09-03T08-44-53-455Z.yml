            - generic [ref=e149]:
              - heading "What it is" [level=2] [ref=e151]
              - generic [ref=e152]:
                - paragraph [ref=e153]: Barabar is an AI finance controller for businesses that collect money through Razorpay. It takes three things a merchant already has — Razorpay's settlement records, the bank statement and the sales ledger — matches every rupee across all three, explains every rupee it cannot match, and drafts the accounting entries.
                - paragraph [ref=e154]: "It answers the question every founder asks at month end: “I sold ₹2,10,000 this week. Why did ₹1,83,412 land in my bank?” — to the paise, with a proof. Barabar (बराबर) means “exactly equal”. When the residual is ₹0.00, the books are barabar."
              - generic [ref=e155]: Built for Razorpay's AI Buildathon, Track 04 (AI Finance Controller). The brief asks for an agent that “closes one finance-ops loop across a 50+ record batch, reporting its match rate and the exceptions it could not resolve.” Barabar's match rates are measured against known ground truth, not asserted.
            - generic [ref=e156]:
              - heading "The problem, in one story" [level=2] [ref=e158]
              - paragraph [ref=e160]: "A clothing brand's customers pay ₹2,10,000 through Razorpay in a week. Razorpay does not send that money order by order. Every working day it bundles hundreds of payments into one settlement and sends one lump bank transfer. Before it lands, several things are quietly subtracted or shifted:"
              - table [ref=e163]:
                - rowgroup [ref=e164]:
                  - row [ref=e165]:
                    - columnheader "What happens" [ref=e166]
                    - columnheader "Why" [ref=e167]
                    - columnheader "Effect" [ref=e168]
                - rowgroup [ref=e169]:
                  - row [ref=e170]:
                    - cell "Gateway fee (MDR)" [ref=e171]
                    - cell "About 2% on cards and net-banking, 0% on UPI" [ref=e172]
                    - cell "−₹3,420.00" [ref=e173]
                  - row [ref=e174]:
                    - cell "18% GST on that fee" [ref=e175]
                    - cell "Tax on the fee, not on the sale. Claimable back as input credit" [ref=e176]
                    - cell "−₹615.60" [ref=e177]
                  - row [ref=e178]:
                    - cell "Refunds netted" [ref=e179]
                    - cell "Refunds are deducted from a later settlement, never paid separately" [ref=e180]
                    - cell "−₹18,452.40" [ref=e181]
                  - row [ref=e182]:
                    - cell "A chargeback" [ref=e183]
                    - cell "A customer disputed a payment; the bank pulled the money back" [ref=e184]
                    - cell "−₹4,200.00" [ref=e185]
                  - row [ref=e186]:
                    - cell "A manual adjustment" [ref=e187]
                    - cell "Razorpay credited ₹100 for a fee waiver" [ref=e188]
                    - cell "+₹100.00" [ref=e189]
                  - row [ref=e190]:
                    - cell "Lands in the bank" [ref=e191]
                    - cell "One NEFT credit, two working days later, with a 16-character reference (UTR)" [ref=e192]
                    - cell "₹1,83,412.00" [ref=e193]
              - paragraph [ref=e195]: Now multiply by 22 settlement days a month, a bank export that cuts the reference number off after 50 characters, refunds that appear a week after the sale, a public holiday that shifts a payout, and a Tally ledger edited by hand. A finance person spends days every month on this and still carries a line called “unexplained”. Barabar deletes that line.
            - generic [ref=e196]:
              - heading "Words you need (and nothing more)" [level=2] [ref=e198]
              - generic [ref=e201]:
                - generic [ref=e202]:
                  - term [ref=e203]: Razorpay
                  - definition [ref=e204]: The payment gateway. Customers pay through it; it pays the merchant later.
                - generic [ref=e205]:
                  - term [ref=e206]: Settlement
                  - definition [ref=e207]: One batch payout from Razorpay to the merchant's bank, covering many payments net of fees, refunds and chargebacks.
                - generic [ref=e208]:
                  - term [ref=e209]: UTR
                  - definition [ref=e210]: The bank's reference for a transfer (16 characters NEFT, 22 RTGS, 12 digits IMPS). The strongest key for matching a settlement to a bank credit.
                - generic [ref=e211]:
                  - term [ref=e212]: Recon line
                  - definition [ref=e213]: "Razorpay's per-payment breakdown inside a settlement: gross, fee, tax and the net credited."
                - generic [ref=e214]:
                  - term [ref=e215]: Ledger
                  - definition [ref=e216]: "The merchant's own sales book (Tally, Zoho, a spreadsheet): invoices and credit notes."
                - generic [ref=e217]:
                  - term [ref=e218]: Reconciliation
                  - definition [ref=e219]: Proving that what Razorpay says, what the bank shows and what the books record are the same money.
                - generic [ref=e220]:
                  - term [ref=e221]: Exception
                  - definition [ref=e222]: Anything that did not match cleanly. Each gets a type (23 of them), an amount, a confidence and a suggested action.
                - generic [ref=e223]:
                  - term [ref=e224]: Proof tree
                  - definition [ref=e225]: The chain from one bank credit down to every payment, fee, refund and chargeback inside it, with the rule that made each link.
                - generic [ref=e226]:
                  - term [ref=e227]: Tiers A / B / C / D
                  - definition [ref=e228]: "The four matching strategies: exact keys (A), derived netting (B), fuzzy proposals (C), the AI investigator (D). Only A and B link automatically."
