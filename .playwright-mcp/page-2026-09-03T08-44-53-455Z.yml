              - heading "Where AI is, and where it is not" [level=2] [ref=e388]
              - paragraph [ref=e390]: Most “AI finance” tools let a language model decide what matches what. Barabar never does. Money decisions are code with tests; the AI works only on the tail, and every number it writes is checked against the tool results it actually received (NumberGuard). If it tries to round ₹1,83,412.37 to ₹1,83,412, the message is blocked.
