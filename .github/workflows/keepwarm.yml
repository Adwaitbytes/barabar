name: keep warm

# Hobby-plan functions go cold after a few idle minutes and a cold Python start costs
# seconds. A cheap ping every five minutes keeps the API and the app warm for demos.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: warm the API and the app
        run: |
          set -e
          curl -sf -o /dev/null -w "api health %{time_total}s\n" https://barabar-api.vercel.app/health
          RID=$(curl -sf https://barabar-api.vercel.app/runs | python3 -c "import sys,json; r=json.load(sys.stdin); print(r[0]['run_id'] if r else '')")
          if [ -n "$RID" ]; then
            curl -sf -o /dev/null -w "close-pack %{time_total}s\n" "https://barabar-api.vercel.app/runs/$RID/close-pack"
            curl -sf -o /dev/null -w "exceptions %{time_total}s\n" "https://barabar-api.vercel.app/runs/$RID/exceptions"
          fi
          curl -sf -o /dev/null -w "app %{time_total}s\n" https://barabar-xi.vercel.app/app
          curl -sf -o /dev/null -w "landing %{time_total}s\n" https://barabar-xi.vercel.app/
