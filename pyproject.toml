[project]
name = "barabar"
version = "0.1.0"
description = "Barabar — AI Finance Controller: reconciles Razorpay settlements, bank statements and the sales ledger to the paise, with typed exceptions and proof trees."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.9",
  "rapidfuzz>=3.10",
  "pyyaml>=6.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "httpx>=0.27",
  "openpyxl>=3.1",
  "anthropic>=0.40",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "hypothesis>=6.112",
  "ruff>=0.6",
  "pyright>=1.1.380",
  "import-linter>=2.0",
  "freezegun>=1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/barabar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "perf: performance tests (slow)",
  "agent: tests that call the LLM (skipped without ANTHROPIC_API_KEY)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W", "SIM", "RUF"]
ignore = ["RUF012"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false

[tool.importlinter]
root_package = "barabar"
contracts = [
  { name = "core depends on nothing inside barabar", type = "forbidden", source_modules = ["barabar.core"], forbidden_modules = ["barabar.generator", "barabar.simulator", "barabar.adapters", "barabar.agent", "barabar.exports", "barabar.api", "barabar.evals"] },
  { name = "simulator/generator never import api or agent", type = "forbidden", source_modules = ["barabar.simulator", "barabar.generator"], forbidden_modules = ["barabar.api", "barabar.agent", "barabar.adapters", "barabar.exports"] },
  { name = "adapters/exports never import api or agent", type = "forbidden", source_modules = ["barabar.adapters", "barabar.exports"], forbidden_modules = ["barabar.api", "barabar.agent"] },
]
